name: APK derle

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Expo projesini hazırla
        run: |
          set -o pipefail
          npx --yes create-expo-app@latest app --template blank@sdk-54
          cd app
          npx --yes expo install expo-font expo-asset expo-build-properties expo-audio expo-file-system expo-status-bar @react-native-async-storage/async-storage @react-navigation/native @react-navigation/bottom-tabs @react-navigation/native-stack react-native-screens react-native-safe-area-context @expo/vector-icons
          cp ../App.js ../app.json ../eas.json .
          rm -rf src && cp -r ../src src
          npx --yes expo install --fix || true
          npx --yes expo prebuild --platform android --clean

      - name: APK derle
        working-directory: app/android
        run: |
          set -o pipefail
          ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a 2>&1 | tee ../../gradle.log || {
            msg=$( (grep -n -A25 "What went wrong" ../../gradle.log || tail -60 ../../gradle.log) | head -80 | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')
            echo "::error title=Gradle hatasi::$msg"
            msg2=$(grep -nE "error:|ERROR:|e: " ../../gradle.log | head -30 | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g')
            [ -n "$msg2" ] && echo "::error title=Derleme satirlari::$msg2"
            exit 1
          }

      - name: APK'yı adlandır
        run: cp app/android/app/build/outputs/apk/release/app-release.apk Ritim.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Ritim-apk
          path: Ritim.apk

      - name: Sürüm olarak yayınla
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Ritim 1.0.${{ github.run_number }}
          files: Ritim.apk
