name: APK derle

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Expo projesini hazırla
        run: |
          npx --yes create-expo-app@latest app --template blank@sdk-54
          cd app
          npx --yes expo install expo-audio expo-file-system expo-status-bar @react-native-async-storage/async-storage @react-navigation/native @react-navigation/bottom-tabs @react-navigation/native-stack react-native-screens react-native-safe-area-context @expo/vector-icons
          cp ../App.js ../app.json ../eas.json .
          rm -rf src && cp -r ../src src
          npx --yes expo install --fix || true
          npx --yes expo prebuild --platform android --clean

      - name: APK derle
        working-directory: app/android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a

      - name: APK'yı adlandır
        run: cp app/android/app/build/outputs/apk/release/app-release.apk Ritim.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Ritim-apk
          path: Ritim.apk

      - name: Sürüm olarak yayınla
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Ritim 1.0.${{ github.run_number }}
          files: Ritim.apk
