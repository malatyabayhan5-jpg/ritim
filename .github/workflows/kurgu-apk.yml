name: Kurgu APK

on:
  push:
    branches: [main, 'claude/**']
    paths:
      - 'kurgu/**'
      - '.github/workflows/kurgu-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    defaults:
      run:
        working-directory: kurgu
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: kurgu/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Bağımlılıklar
        run: npm ci

      - name: Birim testleri ve çeviri denetimi
        run: |
          npm test
          npm run i18n:check

      - name: JS paketini doğrula
        run: npx expo export --platform android --output-dir /tmp/kurgu-bundle > /dev/null

      - name: Yerel projeyi üret
        run: npx expo prebuild --platform android --clean --no-install

      - name: APK derle
        working-directory: kurgu/android
        run: |
          set -o pipefail
          ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a,x86_64 2>&1 | tee ../../gradle.log || {
            msg=$( (grep -n -A25 "What went wrong" ../../gradle.log || tail -60 ../../gradle.log) | head -80 | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')
            echo "::error title=Gradle hatasi::$msg"
            msg2=$(grep -nE "^e: |error:|ERROR:" ../../gradle.log | head -40 | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g')
            [ -n "$msg2" ] && echo "::error title=Derleme satirlari::$msg2"
            exit 1
          }

      - name: APK'yı adlandır
        run: cp android/app/build/outputs/apk/release/app-release.apk ../Kurgu.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Kurgu-apk
          path: Kurgu.apk
