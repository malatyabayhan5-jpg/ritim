name: Kurgu APK

on:
  push:
    branches: [main, 'claude/**']
    paths:
      - 'kurgu/**'
      - '.github/workflows/kurgu-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    defaults:
      run:
        working-directory: kurgu
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: kurgu/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Yalnızca test/belge değiştiyse APK yeniden derlenmez (emülatör testleri hızlı yinelenir)
      - name: APK önbelleği
        id: apkcache
        uses: actions/cache@v4
        with:
          path: Kurgu.apk
          key: kurgu-apk-${{ hashFiles('kurgu/package-lock.json', 'kurgu/app.json', 'kurgu/App.js', 'kurgu/index.js', 'kurgu/src/**', 'kurgu/modules/**', 'kurgu/assets/**') }}

      - name: Bağımlılıklar
        run: npm ci

      - name: Birim testleri ve çeviri denetimi
        run: |
          npm test
          npm run i18n:check
          npm run test:dsp

      - name: JS paketini doğrula
        if: steps.apkcache.outputs.cache-hit != 'true'
        run: npx expo export --platform android --output-dir /tmp/kurgu-bundle > /dev/null

      - name: Yerel projeyi üret
        if: steps.apkcache.outputs.cache-hit != 'true'
        run: npx expo prebuild --platform android --clean --no-install

      - name: APK derle
        if: steps.apkcache.outputs.cache-hit != 'true'
        working-directory: kurgu/android
        run: |
          set -o pipefail
          ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a,x86_64 2>&1 | tee ../../gradle.log || {
            msg=$( (grep -n -A25 "What went wrong" ../../gradle.log || tail -60 ../../gradle.log) | head -80 | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')
            echo "::error title=Gradle hatasi::$msg"
            msg2=$(grep -nE "^e: |error:|ERROR:" ../../gradle.log | head -40 | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g')
            [ -n "$msg2" ] && echo "::error title=Derleme satirlari::$msg2"
            exit 1
          }

      - name: APK'yı adlandır
        if: steps.apkcache.outputs.cache-hit != 'true'
        run: cp android/app/build/outputs/apk/release/app-release.apk ../Kurgu.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Kurgu-apk
          path: Kurgu.apk

  e2e:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 75
    # Her grup taze bir emülatörde: uzun oturumda emülatörün sanal GPU'su tükenip
    # donabiliyor (CI #62, #65). Grup içi akışlar birbirinin projesini kullanır.
    strategy:
      fail-fast: false
      matrix:
        include:
          - grup: ai-dil-performans
            akislar: 3_ai_araclari 4_otomatik_altyazi 2_dil_rtl 5_performans
          - grup: katman-ses-fotograf
            akislar: 6_katmanlar 7_seslendirme 8_fotograf
          - grup: kabul-disa-aktarma
            akislar: 1_kabul_akisi
            # Deney (BUG-010): geçişli çok girişli önizlemede arayüz 90 sn donuyor; yalnızca bu
            # grupta ANGLE üzerinden SwiftShader (swangle) denenir, diğer gruplar karşılaştırma için
            # eski modda kalır.
            gpu: swangle_indirect
    name: e2e (${{ matrix.grup }})
    env:
      E2E_FLOWS: ${{ matrix.akislar }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: Kurgu-apk

      - name: ffmpeg ve konuşma sentezi (test medyası)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg espeak-ng > /dev/null

      - name: KVM'yi etkinleştir
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Emülatörde kabul testi
        continue-on-error: true
        timeout-minutes: 60
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          cores: 2
          ram-size: 3072M
          disk-size: 6000M
          emulator-boot-timeout: 1500
          disable-animations: true
          # -feature -HardwareDecoder: emülatörün ana makinedeki H.264 köprüsü (goldfish) her
          # donmadan önce "no frame / ColorBuffer" hataları veriyordu (CI #62, #65, #67);
          # konuk içi yazılımsal çözücü (c2.android) kullanılır.
          emulator-options: -no-window -gpu ${{ matrix.gpu || 'swiftshader_indirect' }} -noaudio -no-boot-anim -camera-back none -no-snapshot -skin 540x1170 -feature -HardwareDecoder
          script: bash kurgu/e2e/run.sh

      - name: Sonuçlar
        if: always()
        run: |
          if [ -d e2e-out ]; then
            summary=$( (cat e2e-out/cihaz.txt | head -1; cat e2e-out/sonuclar.txt) 2>/dev/null | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g')
            echo "::notice title=Kurgu emulator testi (${{ matrix.grup }})::$summary"
          else
            echo "::warning title=Kurgu emulator testi (${{ matrix.grup }})::Emülatör testi çalışmadı"
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Kurgu-e2e-${{ matrix.grup }}
          path: e2e-out
