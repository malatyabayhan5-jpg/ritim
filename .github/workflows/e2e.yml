name: Uçtan uca test (emülatör)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Test edilecek sürüm etiketi (boş: en son)"
        required: false
      api:
        description: "Android API seviyesi"
        required: false
        default: "31"

permissions:
  contents: write

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: APK'yı sürümden indir
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.event.inputs.tag }}"
          if [ -z "$TAG" ]; then TAG=$(gh release view --json tagName -q .tagName); fi
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          gh release download "$TAG" -p Ritim.apk -O Ritim.apk
          ls -l Ritim.apk

      - name: KVM'yi etkinleştir
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Emülatörde test
        continue-on-error: true
        timeout-minutes: 45
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ github.event.inputs.api || '31' }}
          target: google_apis_playstore
          arch: x86_64
          cores: 4
          ram-size: 4096M
          disk-size: 6000M
          emulator-boot-timeout: 1500
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot
          script: bash e2e/run.sh

      - name: Sonuçları yayınla
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -d e2e-out ]; then
            zip -qr e2e-sonuclari.zip e2e-out
            gh release upload "$TAG" e2e-sonuclari.zip --clobber || true
            summary=$( (cat e2e-out/cihaz.txt; cat e2e-out/sonuclar.txt) 2>/dev/null | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g')
            echo "::notice title=Uctan uca test::$summary"
          else
            echo "::warning title=Uctan uca test::Emülatör testi çalışmadı"
          fi
