# İndirme iptali: veriyi 60 saniyede yavaşça gönderen bir test adresinden (httpbin.org/drip) indirme başlatılır,
# birkaç saniye sonra iptal edilir. İptalden sonra indirme listesinden kalkmalı ve yarım dosya kaydedilmemeli.
appId: com.ritim.muzik
---
- launchApp
- tapOn:
    id: "tab-download"
- tapOn:
    id: "link-input"
- inputText: "https://httpbin.org/drip?duration=60&numbytes=3000000&code=200&delay=0"
- tapOn:
    id: "link-go"
- extendedWaitUntil:
    visible:
      id: "link-cancel"
    timeout: 20000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 10a_indiriliyor
- tapOn:
    id: "link-cancel"
- extendedWaitUntil:
    notVisible:
      id: "link-cancel"
    timeout: 15000
- takeScreenshot: 10b_iptal_edildi
- tapOn:
    id: "tab-library"
- tapOn:
    id: "lib-audio"
- extendedWaitUntil:
    visible:
      text: "İndirilen ses yok"
    timeout: 10000
- takeScreenshot: 10c_yarim_dosya_kaydedilmedi
