# Senaryo 2: Arama yapma ve sonuçları listeleme (sonuçlar uygulama içindeki ekranda)
appId: com.ritim.muzik
---
- inputText: "nature sounds"
- tapOn:
    id: "yt-go"
- extendedWaitUntil:
    visible:
      id: "yt-browse"
    timeout: 20000
- runFlow:
    when:
      visible: "Accept all"
    commands:
      - tapOn: "Accept all"
- runFlow:
    when:
      visible: "Tümünü kabul et"
    commands:
      - tapOn: "Tümünü kabul et"
- extendedWaitUntil:
    visible:
      text: ".*([Nn]ature|NATURE).*"
      index: 1
    timeout: 45000
- assertVisible:
    id: "yt-browse"
- takeScreenshot: 2_arama_sonuclari
