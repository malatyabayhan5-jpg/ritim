# Üst katman (resim içinde resim): sahne videosu üzerine fotoğraf katmanı, daire
# maskesi, 720p dışa aktarma. Çıktı run.sh içinde layer_check.py ile denetlenir:
# katman yalnızca 0–3 sn arasında, kanvas ortasında ve maske dışında görünmemeli.
appId: app.kurgu.editor
# Not: CI #59'da Maestro bazı kimlikleri (new-project) ekranda görünürken bulamadı; metinle eşlenir.
---
- launchApp
- extendedWaitUntil:
    visible:
      text: "(Yeni proje|New project)"
    timeout: 30000
- tapOn:
    text: "(Yeni proje|New project)"
- waitForAnimationToEnd:
    timeout: 5000
# Sahne test videosu seçicide süresinden bulunur (7,5 sn)
- tapOn:
    text: "00:0[78]"
- tapOn:
    text: "(Add|Ekle).*"
- extendedWaitUntil:
    visible:
      id: "clip-0"
    timeout: 90000
- waitForAnimationToEnd:
    timeout: 3000
- tapOn:
    id: "tool-back"
    optional: true
# Katman ekle: tekli seçicide fotoğraf seçilir (seçim hemen döner)
- tapOn:
    id: "tool-overlay"
- waitForAnimationToEnd:
    timeout: 5000
# Öğe erişilebilirlik metni "Photo taken on ..." ("Photos" sekmesiyle karışmasın)
- tapOn:
    text: "(Photo taken|Fotoğraf çekildi).*"
    index: 0
- extendedWaitUntil:
    visible:
      id: "overlay-item-ovl_.*"
    timeout: 30000
- extendedWaitUntil:
    visible:
      id: "overlay-handle"
    timeout: 10000
# Not: katman eklendikten hemen sonra Maestro ekran görüntüsü null dönüyor (CI #68); burada alınmaz
# Daire maskesi
- tapOn:
    id: "tool-mask"
# Yavaş emülatörde ilk dokunuş araç çubuğu yeniden çizilirken boşa gidebiliyor (CI #69)
- runFlow:
    when:
      notVisible:
        id: "panel-layer"
    commands:
      - waitForAnimationToEnd:
          timeout: 5000
      - tapOn:
          id: "tool-mask"
          optional: true
- extendedWaitUntil:
    visible:
      id: "panel-layer"
    timeout: 20000
- tapOn:
    id: "mask-ellipse"
- waitForAnimationToEnd:
    timeout: 3000
- tapOn:
    id: "panel-done"
# Geri al / yinele: maske kaybolup geri gelmeli (çökme olmamalı)
- tapOn:
    id: "undo"
- tapOn:
    id: "redo"
# Hareket takibi (katman videodaki nesneyi izler). Sonuç ne olursa olsun bildirim
# görünmeli ve uygulama çökmemeli; ardından geri alınır (katman testi sabit konumu bekler).
- tapOn:
    id: "tool-track"
- extendedWaitUntil:
    visible:
      text: "(Takip tamamlandı|Nesne izlenemedi|Hareket takibi başarısız|Tracking done|Couldn't track|Motion tracking failed).*"
    timeout: 120000
- runFlow:
    when:
      visible:
        text: "(Takip tamamlandı|Tracking done).*"
    commands:
      - tapOn:
          id: "undo"
- tapOn:
    id: "tool-back"
    optional: true
# Dışa aktar (720p)
- tapOn:
    id: "export-open"
- extendedWaitUntil:
    visible:
      id: "export-start"
    timeout: 20000
- tapOn:
    id: "res-720"
    optional: true
- tapOn:
    id: "export-start"
- tapOn:
    text: "(Allow|ALLOW|İzin ver|İZİN VER)"
    optional: true
- extendedWaitUntil:
    visible:
      id: "export-done"
    timeout: 900000
- waitForAnimationToEnd:
    timeout: 5000
- assertVisible:
    id: "check-duration-ok"
- assertVisible:
    id: "check-resolution-ok"
- scrollUntilVisible:
    element:
      id: "export-finish"
- tapOn:
    id: "export-finish"
