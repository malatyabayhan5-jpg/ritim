# Üst katman (resim içinde resim): sahne videosu üzerine fotoğraf katmanı, daire
# maskesi, 720p dışa aktarma. Çıktı run.sh içinde layer_check.py ile denetlenir:
# katman yalnızca 0–3 sn arasında, kanvas ortasında ve maske dışında görünmemeli.
appId: app.kurgu.editor
# Not: CI #59'da Maestro bazı kimlikleri (new-project) ekranda görünürken bulamadı; metinle eşlenir.
---
- launchApp
- extendedWaitUntil:
    visible:
      text: "(Yeni proje|New project)"
    timeout: 30000
- tapOn:
    text: "(Yeni proje|New project)"
- waitForAnimationToEnd:
    timeout: 5000
# Sahne test videosu seçicide süresinden bulunur (7,5 sn)
- tapOn:
    text: "00:0[78]"
- tapOn:
    text: "(Add|Ekle).*"
- extendedWaitUntil:
    visible:
      id: "clip-0"
    timeout: 90000
- waitForAnimationToEnd:
    timeout: 3000
- tapOn:
    id: "tool-back"
    optional: true
# Katman ekle: tekli seçicide fotoğraf seçilir (seçim hemen döner)
- tapOn:
    id: "tool-overlay"
- waitForAnimationToEnd:
    timeout: 5000
# Öğe erişilebilirlik metni "Photo taken on ..." ("Photos" sekmesiyle karışmasın)
- tapOn:
    text: "(Photo taken|Fotoğraf çekildi).*"
    index: 0
- extendedWaitUntil:
    visible:
      id: "overlay-item-ovl_.*"
    timeout: 30000
- extendedWaitUntil:
    visible:
      id: "overlay-handle"
    timeout: 10000
# Not: katman eklendikten hemen sonra Maestro ekran görüntüsü null dönüyor (CI #68); burada alınmaz
# Daire maskesi
- tapOn:
    id: "tool-mask"
# Yavaş emülatörde ilk dokunuş araç çubuğu yeniden çizilirken boşa gidebiliyor (CI #69)
- runFlow:
    when:
      notVisible:
        id: "panel-layer"
    commands:
      - waitForAnimationToEnd:
          timeout: 5000
      - tapOn:
          id: "tool-mask"
          optional: true
- extendedWaitUntil:
    visible:
      id: "panel-layer"
    timeout: 20000
- tapOn:
    id: "mask-ellipse"
- waitForAnimationToEnd:
    timeout: 3000
- tapOn:
    id: "panel-done"
# Geri al / yinele: maske kaybolup geri gelmeli (çökme olmamalı)
# Katman eklenmiş ekranda Maestro kimlikleri tutarsız buluyor (CI #74–#76); bu adımlar isteğe bağlı
- tapOn:
    id: "undo"
    optional: true
- tapOn:
    id: "redo"
    optional: true
# Yinele kimlikle bulunamazsa maske geri alınmış kalır ve dışa aktarma maskesiz olur (CI #96).
# Etiketle tekrar denenir; yinelenecek bir şey kalmadıysa düğme devre dışıdır, dokunuş zararsız.
- tapOn:
    text: "(Yinele|Redo)"
    optional: true
- tapOn:
    id: "redo"
    optional: true
- tapOn:
    id: "tool-back"
    optional: true
# Dışa aktar (720p). Katman ekranında Maestro kimlikleri tutarsız bulduğundan metin yedeği (CI #80)
- tapOn:
    id: "export-open"
    optional: true
# Ekranın açılması animasyonludur: önce kısa süre beklenir, açılmadıysa metin yedeği
- extendedWaitUntil:
    visible:
      text: "(Çözünürlük|Resolution)"
    timeout: 8000
    optional: true
- runFlow:
    when:
      notVisible:
        text: "(Çözünürlük|Resolution)"
    commands:
      - tapOn:
          text: "(Dışa aktar|Export)"
          index: 0
          optional: true
# Dışa aktarma ekranı açıldı mı: başlık metninden. Başlat düğmesi katmanlı projede (uyarılar,
# kodek satırı) ekranın altında kalabilir (CI #84) → kaydırılarak aranır.
- extendedWaitUntil:
    visible:
      text: "(Çözünürlük|Resolution)"
    timeout: 20000
- tapOn:
    id: "res-720"
    optional: true
- scrollUntilVisible:
    element:
      text: "(Videoyu dışa aktar|Export video)"
    timeout: 20000
- tapOn:
    text: "(Videoyu dışa aktar|Export video)"
- tapOn:
    text: "(Allow|ALLOW|İzin ver|İZİN VER)"
    optional: true
- extendedWaitUntil:
    visible:
      id: "export-done"
    timeout: 900000
- waitForAnimationToEnd:
    timeout: 5000
- assertVisible:
    id: "check-duration-ok"
- assertVisible:
    id: "check-resolution-ok"
- scrollUntilVisible:
    element:
      id: "export-finish"
- tapOn:
    id: "export-finish"
# Hareket takibi (dışa aktarmadan sonra: katman testi sabit konumu bekler). Katman seçilir,
# Takip çalışır; işlem bitince (meşgul göstergesi kaybolur) uygulama ayakta kalmalı.
# Bildirim kısa sürdüğünden yakalanması beklenmez; sonuç günlükte ([KurguAI] track).
- tapOn:
    id: "overlay-item-ovl_.*"
- extendedWaitUntil:
    visible:
      text: "(Takip|Track|تتبّع)"
    timeout: 15000
- tapOn:
    text: "(Takip|Track|تتبّع)"
- extendedWaitUntil:
    notVisible:
      id: "busy"
    timeout: 180000
- waitForAnimationToEnd:
    timeout: 3000
# Takip sonucu günlükten doğrulanır (run.sh: [KurguAI] track ... lost=); burada yalnızca
# uygulamanın ayakta ve önizlemenin hatasız olduğu denetlenir. Kimlikle eleman arama bu
# ekranda kararsız (CI #82: düğme görünürken bulunamadı), bu yüzden metin denetimi.
- assertNotVisible:
    text: "(Önizleme hatası|Preview error).*"
- assertVisible:
    text: "(Takip|Track|تتبّع)"
    optional: true
