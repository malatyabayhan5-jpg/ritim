# Cihaz içi AI araçları: sahne algılama (3 sahneli test videosu), geri al,
# sessizlik kaldırma (2 sn sessiz bölüm), metinden konuşma (cihaz TTS motoru).
appId: app.kurgu.editor
---
- launchApp
- extendedWaitUntil:
    visible:
      id: "new-project"
    timeout: 30000
- tapOn:
    id: "new-project"
- waitForAnimationToEnd:
    timeout: 5000
# Sahne test videosu seçicide süresinden bulunur (7,5 sn)
- tapOn:
    text: "00:0[78]"
- tapOn:
    text: "(Add|Ekle).*"
- extendedWaitUntil:
    visible:
      id: "clip-0"
    timeout: 90000
- waitForAnimationToEnd:
    timeout: 3000
- tapOn:
    id: "tool-back"
    optional: true
# Sahne algılama
- tapOn:
    id: "tool-ai"
- extendedWaitUntil:
    visible:
      id: "panel-ai"
    timeout: 5000
- takeScreenshot:
    path: 30_ai_paneli
    optional: true
- tapOn:
    id: "ai-run-sceneDetect"
- extendedWaitUntil:
    visible:
      id: "clip-2"
    timeout: 90000
- takeScreenshot:
    path: 31_sahneler
    optional: true
- tapOn:
    id: "undo"
- extendedWaitUntil:
    notVisible:
      id: "clip-1"
    timeout: 5000
# Sessizlik kaldırma
- tapOn:
    id: "tool-ai"
- tapOn:
    id: "ai-run-silenceRemoval"
- extendedWaitUntil:
    visible:
      id: "clip-1"
    timeout: 90000
- takeScreenshot:
    path: 32_sessizlik_kaldirildi
    optional: true
# Metinden konuşma (emülatörde yüklü ses yoksa uygulama açıklayıcı hata gösterir)
- tapOn:
    id: "tool-text"
- tapOn:
    id: "tool-addText"
- tapOn:
    id: "text-input"
- eraseText: 20
- inputText: "Hello from Kurgu"
- hideKeyboard
- tapOn:
    id: "panel-done"
# Metin anahtar kareleri: panel açılır, konum X için kare eklenir
- tapOn:
    id: "tool-textKeys"
- extendedWaitUntil:
    visible:
      id: "panel-text-keys"
    timeout: 5000
- tapOn:
    id: "kf-x"
- tapOn:
    id: "panel-done"
- tapOn:
    id: "tool-back"
    optional: true
- tapOn:
    id: "tool-back"
    optional: true
# Video zaman çizelgesine şekil: saydam PNG çizilip üst katman olarak eklenmeli
- tapOn:
    id: "tool-text"
- tapOn:
    id: "tool-shape"
- tapOn:
    id: "shape-star"
- tapOn:
    id: "shape-add"
- extendedWaitUntil:
    visible:
      id: "overlay-handle"
    timeout: 20000
- tapOn:
    id: "tool-back"
    optional: true
- tapOn:
    id: "tool-back"
    optional: true
- tapOn:
    id: "tool-ai"
- tapOn:
    id: "ai-run-textToSpeech"
- waitForAnimationToEnd:
    timeout: 20000
- takeScreenshot:
    path: 33_seslendirme
    optional: true
- runFlow:
    when:
      visible:
        id: "audio-item-.*"
    commands:
      - takeScreenshot:
          path: 34_seslendirme_eklendi
          optional: true
      # Ses efekti ön ayarı ve ses düzeyi anahtar karesi (yerel işlem zinciri önizlemede kurulur)
      - tapOn:
          id: "tool-back"
          optional: true
      - tapOn:
          id: "audio-item-.*"
      - tapOn:
          id: "tool-audioFx"
      - tapOn:
          id: "audiofx-cat-voice"
      - tapOn:
          id: "audiofx-preset-podcast"
      - waitForAnimationToEnd:
          timeout: 3000
      - tapOn:
          id: "panel-done"
      # Panel kapanınca araç çubuğu yeniden çizilir (CI #68: erken dokunuş boşa gitti)
      - extendedWaitUntil:
          visible:
            id: "tool-volume"
          timeout: 10000
      - tapOn:
          id: "tool-volume"
      - tapOn:
          id: "kf-volume"
      - tapOn:
          id: "panel-done"
      - tapOn:
          id: "play-toggle"
      - waitForAnimationToEnd:
          timeout: 3000
      - tapOn:
          id: "play-toggle"
      - takeScreenshot:
          path: 34b_ses_efekti
          optional: true
      - assertNotVisible:
          text: ".*(ERROR_CODE|Önizleme hatası|Preview error).*"
# Ters oynatma: ilk klip cihazda ters kodlanır (sonuç günlükte: [KurguUI] reverse frames=...)
- tapOn:
    id: "tool-back"
    optional: true
- tapOn:
    id: "clip-0"
- tapOn:
    id: "tool-reverse"
- extendedWaitUntil:
    notVisible:
      id: "busy"
    timeout: 300000
- takeScreenshot:
    path: 35_ters
    optional: true
- assertVisible:
    id: "clip-0"

