# Otomatik altyazı: konuşmalı test videosu (espeak-ng, İngilizce) -> model indirme
# onayı -> cihaz içi tanıma -> zaman çizelgesinde "hello" içeren altyazı katmanı.
appId: app.kurgu.editor
---
- launchApp
- extendedWaitUntil:
    visible:
      id: "new-project"
    timeout: 30000
- tapOn:
    id: "new-project"
- waitForAnimationToEnd:
    timeout: 5000
# Konuşma test videosu seçicide süresinden bulunur (10 sn)
- tapOn:
    text: "00:10"
- tapOn:
    text: "(Add|Ekle).*"
- extendedWaitUntil:
    visible:
      id: "clip-0"
    timeout: 90000
- tapOn:
    id: "tool-back"
    optional: true
- tapOn:
    id: "tool-captions"
- tapOn:
    id: "tool-autoCaptions"
- extendedWaitUntil:
    visible:
      id: "caption-start"
    timeout: 10000
- tapOn:
    id: "caption-lang-en"
- tapOn:
    id: "caption-model-base"
- takeScreenshot:
    path: 40_altyazi_paneli
    optional: true
- tapOn:
    id: "caption-start"
# Model indirme onayı
- tapOn:
    text: "(İndir|İNDİR|Download|DOWNLOAD)"
- extendedWaitUntil:
    visible:
      id: "caption-progress"
    timeout: 10000
- takeScreenshot:
    path: 41_altyazi_ilerleme
    optional: true
- extendedWaitUntil:
    notVisible:
      id: "caption-progress"
    timeout: 900000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot:
    path: 42_altyazi_sonuc
    optional: true
- assertVisible:
    id: "text-item-.*"
- assertVisible:
    text: "(?i).*hello.*"
# Altyazı düzenleme listesi: paneli yeniden aç, listeyi aç, ilk satırı sil
- runFlow:
    when:
      notVisible:
        id: "caption-edit"
    commands:
      - tapOn:
          id: "tool-back"
          optional: true
      - tapOn:
          id: "tool-captions"
      - tapOn:
          id: "tool-autoCaptions"
- tapOn:
    id: "caption-edit"
- extendedWaitUntil:
    visible:
      id: "caption-text-0"
    timeout: 10000
- takeScreenshot:
    path: 43_altyazi_listesi
    optional: true
- tapOn:
    id: "caption-time-0"
- tapOn:
    id: "caption-delete-0"
- waitForAnimationToEnd:
    timeout: 3000
# Toplu düzenleme (silmeden sonra satır kaldıysa): seç kipi, tümünü seç, sayaç görünür, kipten çık
- runFlow:
    when:
      visible:
        text: "(Seç|Select)"
    commands:
      - tapOn:
          text: "(Seç|Select)"
      - tapOn:
          text: "(Tümünü seç|Select all)"
      - extendedWaitUntil:
          visible:
            text: "(Seçili|Selected): [1-9].*"
          timeout: 10000
      - tapOn:
          text: "(Bitti|Done)"
          optional: true
- takeScreenshot:
    path: 44_altyazi_satir_silindi
    optional: true