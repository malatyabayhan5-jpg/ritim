# Seslendirme: mikrofonla 3 sn kayıt (emülatörün sanal mikrofonu), ses katmanı olarak eklenmeli.
appId: app.kurgu.editor
---
- launchApp
- extendedWaitUntil:
    visible:
      id: "project-prj_.*"
    timeout: 30000
- tapOn:
    id: "project-prj_.*"
    index: 0
- extendedWaitUntil:
    visible:
      id: "clip-0"
    timeout: 30000
- tapOn:
    id: "tool-back"
    optional: true
- tapOn:
    id: "tool-audio"
# Alt araç çubuğu yeniden çizilirken erken dokunuş boşa gidebiliyor (CI #53, #69)
- runFlow:
    when:
      notVisible:
        id: "tool-record"
    commands:
      - waitForAnimationToEnd:
          timeout: 5000
      - tapOn:
          id: "tool-audio"
          optional: true
- extendedWaitUntil:
    visible:
      text: "(Seslendir|Voiceover|تعليق صوتي)"
    timeout: 60000
- waitForAnimationToEnd:
    timeout: 2000
- tapOn:
    text: "(Seslendir|Voiceover|تعليق صوتي)"
# Çok girişli önizleme kurulurken emülatörün yazılım GL'i arayüzü 15 sn'ye kadar
# durdurabiliyor (CI #138: 16 sn, #141: 39 sn; BUG-010); süre run.sh'ın "Tıkanma" satırında
# ayrıca raporlanır.
- extendedWaitUntil:
    visible:
      id: "record-start"
    timeout: 120000
- tapOn:
    id: "record-start"
- tapOn:
    text: "(Allow|ALLOW|While using the app|İzin ver|Uygulamayı kullanırken).*"
    optional: true
- extendedWaitUntil:
    visible:
      id: "record-stop"
    timeout: 10000
- swipe:
    start: "50%, 20%"
    end: "50%, 20%"
    duration: 3000
- takeScreenshot:
    path: 70_kayit
    optional: true
- tapOn:
    id: "record-stop"
- extendedWaitUntil:
    visible:
      id: "audio-item-.*"
    timeout: 20000
- takeScreenshot:
    path: 71_seslendirme_eklendi
    optional: true
# Videoda arka plan kaldırma: 5 sn'lik test videosu katman olarak eklenir ve araç çalıştırılır.
# Test videosunda kişi yoktur; beklenen "kişi bulunamadı" uyarısıdır. Amaç yerel boru hattının
# (kare okuma, kişi ayırma, kodlama) cihazda baştan sona çalıştığını görmek (run.sh günlükten okur).
- tapOn:
    id: "tool-back"
    optional: true
- tapOn:
    id: "tool-overlay"
- extendedWaitUntil:
    visible:
      text: "00:05"
    timeout: 20000
- tapOn:
    text: "00:05"
- extendedWaitUntil:
    visible:
      id: "tool-removeBg"
    timeout: 30000
- tapOn:
    id: "tool-removeBg"
- extendedWaitUntil:
    notVisible:
      id: "busy"
    timeout: 300000
- takeScreenshot:
    path: 72_arka_plan_kaldirma
    optional: true
